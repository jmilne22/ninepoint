# The whole-game review. KataGo's analysis engine takes one JSON query per
# game and answers one line per position; selected comparisons then use explicit
# per-query maxVisits=200 (actual/best) or 50 (pass) on the same process. The score pass stays at eight.
#
# Eight visits is the same depth the cast opponents play at. Threads here are
# independent positions, not a deeper search, and are set at launch from the
# machine's core count (KataGoAnalysis.thread_count) via -override-config.
logToStderr = false
reportAnalysisWinratesAs = BLACK
maxVisits = 8
numAnalysisThreads = 1
numSearchThreadsPerAnalysisThread = 1
nnMaxBatchSize = 8
nnCacheSizePowerOfTwo = 18
nnMutexPoolSizePowerOfTwo = 14
nnRandomize = false
